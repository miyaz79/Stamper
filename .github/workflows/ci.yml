name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test-backend-ts:
    name: Test backend-ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (backend-ts)
        run: |
          cd apps/backend-ts
          npm ci

      - name: Run tests (backend-ts)
        run: |
          cd apps/backend-ts
          npm test
        env:
          CI: true
